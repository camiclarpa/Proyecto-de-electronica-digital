<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bgCarrito" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#100a05"/>
      <stop offset="100%" stop-color="#060402"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="url(#bgCarrito)"/>

  <text x="450" y="34" text-anchor="middle" fill="#fff2e0" font-size="20" font-weight="bold">Mockup — Pantalla del Carrito</text>
  <text x="450" y="56" text-anchor="middle" fill="#a3805a" font-size="13">Estructura de la pantalla, no arte final. Resolución real: ver hardware/grupo_J_display/README.md</text>

  <!-- Marco -->
  <rect x="110" y="90" width="560" height="420" rx="6" fill="#0a0705" stroke="#ff9f1c" stroke-width="3"/>

  <!-- Pista: 3 carriles -->
  <rect x="110" y="90" width="560" height="420" fill="#1a1410"/>
  <line x1="296" y1="90" x2="296" y2="510" stroke="#ff9f1c" stroke-width="3" stroke-dasharray="18,14"/>
  <line x1="483" y1="90" x2="483" y2="510" stroke="#ff9f1c" stroke-width="3" stroke-dasharray="18,14"/>
  <!-- bordes de la pista -->
  <line x1="110" y1="90" x2="110" y2="510" stroke="#fff2e0" stroke-width="3"/>
  <line x1="670" y1="90" x2="670" y2="510" stroke="#fff2e0" stroke-width="3"/>

  <!-- Puntaje / distancia -->
  <text x="130" y="118" fill="#ff9f1c" font-size="16" font-weight="bold">DISTANCIA 00340</text>

  <!-- Obstaculos en distintos carriles -->
  <rect x="150" y="180" width="90" height="46" rx="4" fill="#c94b2f"/>
  <rect x="523" y="270" width="90" height="46" rx="4" fill="#c94b2f"/>
  <rect x="337" y="350" width="90" height="46" rx="4" fill="#c94b2f"/>

  <!-- Carro del jugador (carril central, abajo) -->
  <rect x="337" y="440" width="90" height="50" rx="6" fill="#ff9f1c"/>
  <rect x="352" y="450" width="18" height="14" rx="2" fill="#3a2a12"/>
  <rect x="394" y="450" width="18" height="14" rx="2" fill="#3a2a12"/>

  <!-- ====== Callouts ====== -->
  <line x1="240" y1="203" x2="740" y2="150" stroke="#c9a97a" stroke-width="1.2"/>
  <circle cx="740" cy="150" r="3" fill="#c9a97a"/>
  <text x="750" y="154" fill="#fff2e0" font-size="13" font-weight="bold">1. Obstáculo</text>
  <text x="750" y="170" fill="#c9a97a" font-size="11">Obstaculo{carril, y, activo}</text>

  <line x1="296" y1="200" x2="740" y2="210" stroke="#c9a97a" stroke-width="1.2"/>
  <circle cx="740" cy="210" r="3" fill="#c9a97a"/>
  <text x="750" y="214" fill="#fff2e0" font-size="13" font-weight="bold">2. División de carriles</text>
  <text x="750" y="230" fill="#c9a97a" font-size="11">NUM_CARRILES = 3 (índices 0,1,2)</text>

  <line x1="427" y1="465" x2="740" y2="400" stroke="#c9a97a" stroke-width="1.2"/>
  <circle cx="740" cy="400" r="3" fill="#c9a97a"/>
  <text x="750" y="404" fill="#fff2e0" font-size="13" font-weight="bold">3. Carro del jugador</text>
  <text x="750" y="420" fill="#c9a97a" font-size="11">Carro.carril — NES: Izq/Der cambia de carril</text>

  <line x1="600" y1="460" x2="740" y2="470" stroke="#c9a97a" stroke-width="1.2"/>
  <circle cx="740" cy="470" r="3" fill="#c9a97a"/>
  <text x="750" y="474" fill="#fff2e0" font-size="13" font-weight="bold">4. Borde de la pista</text>
  <text x="750" y="490" fill="#c9a97a" font-size="11">límite fijo, el carro nunca sale de los 3 carriles</text>

  <text x="450" y="600" text-anchor="middle" fill="#5a4530" font-size="12">Resolución y proporciones ilustrativas — sensación de "scroll" se logra moviendo los obstáculos, no el carro</text>
</svg>
