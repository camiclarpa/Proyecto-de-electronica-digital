  </defs>

  <rect x="0" y="0" width="900" height="640" fill="url(#bgSnake)"/>

  <text x="450" y="34" text-anchor="middle" fill="#f5ffe0" font-size="20" font-weight="bold">Mockup — Pantalla de Snake</text>
  <text x="450" y="56" text-anchor="middle" fill="#8a9a5a" font-size="13">Estructura de la pantalla, no arte final. Resolución real: ver hardware/grupo_J_display/README.md</text>

  <!-- Marco -->
  <rect x="110" y="90" width="560" height="420" rx="6" fill="#04050a" stroke="#c6ff00" stroke-width="3"/>

  <!-- Grilla (celdas de referencia, tenues) -->
  <g stroke="#1b2a0f" stroke-width="1">
    <line x1="150" y1="90" x2="150" y2="510"/>
    <line x1="190" y1="90" x2="190" y2="510"/>
    <line x1="230" y1="90" x2="230" y2="510"/>
    <line x1="270" y1="90" x2="270" y2="510"/>
    <line x1="310" y1="90" x2="310" y2="510"/>
    <line x1="350" y1="90" x2="350" y2="510"/>
    <line x1="390" y1="90" x2="390" y2="510"/>
    <line x1="430" y1="90" x2="430" y2="510"/>
    <line x1="470" y1="90" x2="470" y2="510"/>
    <line x1="510" y1="90" x2="510" y2="510"/>
    <line x1="550" y1="90" x2="550" y2="510"/>
    <line x1="590" y1="90" x2="590" y2="510"/>
    <line x1="630" y1="90" x2="630" y2="510"/>
    <line x1="110" y1="130" x2="670" y2="130"/>
    <line x1="110" y1="170" x2="670" y2="170"/>
    <line x1="110" y1="210" x2="670" y2="210"/>
    <line x1="110" y1="250" x2="670" y2="250"/>
    <line x1="110" y1="290" x2="670" y2="290"/>
    <line x1="110" y1="330" x2="670" y2="330"/>
    <line x1="110" y1="370" x2="670" y2="370"/>
    <line x1="110" y1="410" x2="670" y2="410"/>
    <line x1="110" y1="450" x2="670" y2="450"/>
    <line x1="110" y1="490" x2="670" y2="490"/>
  </g>

  <!-- Puntaje -->
  <text x="130" y="118" fill="#c6ff00" font-size="16" font-weight="bold">PUNTAJE 00120</text>

  <!-- Serpiente: segmentos conectados, cabeza distinta -->
  <rect x="270" y="250" width="38" height="38" fill="#79a300"/>
  <rect x="310" y="250" width="38" height="38" fill="#79a300"/>
  <rect x="350" y="250" width="38" height="38" fill="#79a300"/>
  <rect x="350" y="210" width="38" height="38" fill="#79a300"/>
  <rect x="350" y="170" width="38" height="38" fill="#c6ff00"/> <!-- cabeza -->
  <circle cx="376" cy="185" r="3" fill="#0d0f05"/> <!-- ojo -->

  <!-- Comida -->
  <circle cx="509" cy="349" r="13" fill="#ff4d4d"/>

  <!-- ====== Callouts ====== -->
  <line x1="388" y1="185" x2="740" y2="150" stroke="#8fae5a" stroke-width="1.2"/>
  <circle cx="740" cy="150" r="3" fill="#8fae5a"/>
  <text x="750" y="154" fill="#f5ffe0" font-size="13" font-weight="bold">1. Cabeza</text>
  <text x="750" y="170" fill="#8fae5a" font-size="11">Serpiente.segmentos[0]</text>

  <line x1="290" y1="288" x2="740" y2="220" stroke="#8fae5a" stroke-width="1.2"/>
  <circle cx="740" cy="220" r="3" fill="#8fae5a"/>
  <text x="750" y="224" fill="#f5ffe0" font-size="13" font-weight="bold">2. Cuerpo</text>
  <text x="750" y="240" fill="#8fae5a" font-size="11">segmentos[1..longitud-1]</text>

  <line x1="509" y1="349" x2="740" y2="300" stroke="#8fae5a" stroke-width="1.2"/>
  <circle cx="740" cy="300" r="3" fill="#8fae5a"/>
  <text x="750" y="304" fill="#f5ffe0" font-size="13" font-weight="bold">3. Comida</text>
  <text x="750" y="320" fill="#8fae5a" font-size="11">EstadoSnake.comida (posición aleatoria)</text>

  <line x1="200" y1="490" x2="740" y2="400" stroke="#8fae5a" stroke-width="1.2"/>
  <circle cx="740" cy="400" r="3" fill="#8fae5a"/>
  <text x="750" y="404" fill="#f5ffe0" font-size="13" font-weight="bold">4. Grilla discreta</text>
  <text x="750" y="420" fill="#8fae5a" font-size="11">movimiento por celdas, no en píxeles libres</text>

  <line x1="600" y1="490" x2="740" y2="460" stroke="#8fae5a" stroke-width="1.2"/>
  <circle cx="740" cy="460" r="3" fill="#8fae5a"/>
  <text x="750" y="464" fill="#f5ffe0" font-size="13" font-weight="bold">5. Borde del área</text>
  <text x="750" y="480" fill="#8fae5a" font-size="11">chocar contra él = fin de partida</text>

  <text x="450" y="600" text-anchor="middle" fill="#4a5a30" font-size="12">Resolución, tamaño de celda y proporciones ilustrativas — a definir junto con hardware/grupo_J_display/README.md</text>
</svg>
