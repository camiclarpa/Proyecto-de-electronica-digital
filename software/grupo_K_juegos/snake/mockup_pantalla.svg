<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="bgSnake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f05"/>
      <stop offset="100%" stop-color="#050602"/>
