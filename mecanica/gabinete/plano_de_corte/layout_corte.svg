<svg viewBox="0 0 1220 920" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1220" height="920" fill="#fff"/>
  <text x="610" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#111">
    Plano de corte — Lámina MDF 9mm, 183 × 244 cm
  </text>
  <text x="610" y="68" text-anchor="middle" font-size="16" fill="#666">
    Escala aproximada · 1 lámina alcanza para las 7 piezas del gabinete (con margen de desperdicio real)
  </text>

  <!-- Lamina completa: 183 x 244 cm -> escalamos 4px/cm: 732 x 976, ajustamos a 700x900 -->
  <rect x="60" y="100" width="1098" height="732" fill="#f4e8cf" stroke="#5c3f1f" stroke-width="4"/>
  <text x="70" y="90" font-size="14" fill="#555">183 cm</text>
  <text x="1170" y="470" font-size="14" fill="#555" transform="rotate(90 1170 470)">244 cm</text>

  <!-- Escala: 6 px por cm aprox (183cm*6=1098, 244cm*6=1464 -> demasiado alto, ajustamos a 6px por cm en X y 3px por cm en Y para caber en 732 de alto) -->
  <!-- Usamos 6px/cm en ambos ejes pero solo mostramos hasta 732 alto = 122cm... Para simplificar, dibujamos a escala 4.5px/cm en X (183*4.5=823) y mantenemos proporcion real en Y (244*4.5=1098) - excede. -->
  <!-- Simplificacion: reescalamos toda la lamina a 1098x732 sin mantener proporcion exacta, es un diagrama de layout, no un plano a escala de precision -->

  <!-- Pieza 1: Superior (110x45) -->
  <rect x="80" y="120" width="660" height="270" fill="#d9c7a3" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="410" y="245" text-anchor="middle" font-size="20" font-weight="bold">SUPERIOR</text>
  <text x="410" y="270" text-anchor="middle" font-size="15">110 × 45 cm</text>
  <text x="410" y="292" text-anchor="middle" font-size="13" fill="#555">(4 pantallas + 8 botones + rejilla)</text>

  <!-- Pieza 2: Inferior (110x45) -->
  <rect x="80" y="410" width="660" height="270" fill="#d9c7a3" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="410" y="535" text-anchor="middle" font-size="20" font-weight="bold">INFERIOR</text>
  <text x="410" y="560" text-anchor="middle" font-size="15">110 × 45 cm</text>

  <!-- Pieza 3: Frontal (110x55) -->
  <rect x="760" y="120" width="330" height="220" fill="#e0d3b3" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="925" y="220" text-anchor="middle" font-size="18" font-weight="bold">FRONTAL</text>
  <text x="925" y="242" text-anchor="middle" font-size="14">110 × 55 cm</text>

  <!-- Pieza 4: Trasera (110x55, con recortes de ventilacion y power) -->
  <rect x="760" y="360" width="330" height="220" fill="#e0d3b3" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="925" y="460" text-anchor="middle" font-size="18" font-weight="bold">TRASERA</text>
  <text x="925" y="482" text-anchor="middle" font-size="14">110 × 55 cm</text>
  <text x="925" y="500" text-anchor="middle" font-size="12" fill="#555">(+ rejilla y entrada de poder)</text>

  <!-- Pieza 5 y 6: Laterales (45x55 cada uno) -->
  <rect x="80" y="700" width="180" height="120" fill="#ccb488" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="170" y="755" text-anchor="middle" font-size="15" font-weight="bold">LATERAL IZQ.</text>
  <text x="170" y="775" text-anchor="middle" font-size="13">45 × 55 cm</text>

  <rect x="280" y="700" width="180" height="120" fill="#ccb488" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="370" y="755" text-anchor="middle" font-size="15" font-weight="bold">LATERAL DER.</text>
  <text x="370" y="775" text-anchor="middle" font-size="13">45 × 55 cm</text>

  <!-- Pieza 7: Repisa interna (100x40) -->
  <rect x="480" y="700" width="360" height="120" fill="#bfa06a" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="660" y="755" text-anchor="middle" font-size="16" font-weight="bold">REPISA INTERNA</text>
  <text x="660" y="777" text-anchor="middle" font-size="13">100 × 40 cm (soporta FPGA + fuente)</text>

  <!-- Sobrante -->
  <rect x="860" y="700" width="230" height="120" fill="#f8f8f8" stroke="#999" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="975" y="765" text-anchor="middle" font-size="14" fill="#888">Sobrante</text>
  <text x="975" y="783" text-anchor="middle" font-size="12" fill="#999">(reserva para errores de corte)</text>

  <text x="610" y="880" text-anchor="middle" font-size="16" fill="#333">
    Área total usada: ≈ 30.950 cm² de 44.652 cm² disponibles — 1 sola lámina alcanza, con margen real de sobra
  </text>
</svg>
