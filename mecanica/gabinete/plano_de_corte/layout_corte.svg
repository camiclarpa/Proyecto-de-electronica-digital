<svg viewBox="0 0 1220 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1220" height="1000" fill="#fff"/>
  <text x="610" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#111">
    Plano de corte — Lámina MDF 9mm, 183 × 244 cm
  </text>
  <text x="610" y="68" text-anchor="middle" font-size="16" fill="#666">
    Actualizado con altura 75cm (uso de pie) · 1 lámina sigue alcanzando, con menos margen que antes
  </text>

  <rect x="60" y="100" width="1098" height="732" fill="#f4e8cf" stroke="#5c3f1f" stroke-width="4"/>
  <text x="70" y="90" font-size="14" fill="#555">183 cm</text>
  <text x="1170" y="470" font-size="14" fill="#555" transform="rotate(90 1170 470)">244 cm</text>

  <!-- Pieza 1: Superior (110x45) - sin cambios -->
  <rect x="80" y="120" width="660" height="270" fill="#d9c7a3" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="410" y="245" text-anchor="middle" font-size="20" font-weight="bold">SUPERIOR</text>
  <text x="410" y="270" text-anchor="middle" font-size="15">110 × 45 cm</text>
  <text x="410" y="292" text-anchor="middle" font-size="13" fill="#555">(4 pantallas + 8 botones + rejilla)</text>

  <!-- Pieza 2: Inferior (110x45) - sin cambios -->
  <rect x="80" y="410" width="660" height="270" fill="#d9c7a3" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="410" y="535" text-anchor="middle" font-size="20" font-weight="bold">INFERIOR</text>
  <text x="410" y="560" text-anchor="middle" font-size="15">110 × 45 cm</text>

  <!-- Pieza 3: Frontal (110x75, antes 55) -->
  <rect x="760" y="120" width="330" height="300" fill="#e0d3b3" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="925" y="260" text-anchor="middle" font-size="18" font-weight="bold">FRONTAL</text>
  <text x="925" y="282" text-anchor="middle" font-size="14">110 × 75 cm</text>

  <!-- Pieza 4: Trasera (110x75, antes 55) -->
  <rect x="760" y="440" width="330" height="300" fill="#e0d3b3" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="925" y="580" text-anchor="middle" font-size="18" font-weight="bold">TRASERA</text>
  <text x="925" y="602" text-anchor="middle" font-size="14">110 × 75 cm</text>
  <text x="925" y="620" text-anchor="middle" font-size="12" fill="#555">(+ rejilla, ventilador y entrada de poder)</text>

  <!-- Pieza 5 y 6: Laterales (45x75 cada uno, antes 55) -->
  <rect x="80" y="700" width="180" height="150" fill="#ccb488" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="170" y="765" text-anchor="middle" font-size="15" font-weight="bold">LATERAL IZQ.</text>
  <text x="170" y="785" text-anchor="middle" font-size="13">45 × 75 cm</text>

  <rect x="280" y="700" width="180" height="150" fill="#ccb488" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="370" y="765" text-anchor="middle" font-size="15" font-weight="bold">LATERAL DER.</text>
  <text x="370" y="785" text-anchor="middle" font-size="13">45 × 75 cm</text>

  <!-- Pieza 7: Repisa interna (100x40) - sin cambios -->
  <rect x="480" y="700" width="360" height="120" fill="#bfa06a" stroke="#6b4f2a" stroke-width="3" filter="url(#sh)"/>
  <text x="660" y="755" text-anchor="middle" font-size="16" font-weight="bold">REPISA INTERNA</text>
  <text x="660" y="777" text-anchor="middle" font-size="13">100 × 40 cm (soporta FPGA + fuente)</text>

  <!-- Sobrante (mas chico que antes) -->
  <rect x="860" y="760" width="230" height="70" fill="#f8f8f8" stroke="#999" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="975" y="790" text-anchor="middle" font-size="13" fill="#888">Sobrante</text>
  <text x="975" y="808" text-anchor="middle" font-size="11" fill="#999">(menor margen que antes)</text>

  <text x="610" y="900" text-anchor="middle" font-size="16" fill="#333">
    Área total usada: ≈ 37.150 cm² de 44.652 cm² disponibles — 1 lámina alcanza, ~7.500 cm² de sobrante (antes ~13.700 cm²)
  </text>
  <text x="610" y="930" text-anchor="middle" font-size="14" fill="#a4231a">
    Cortar con cuidado: el margen de error bajó al subir la altura de 55cm a 75cm
  </text>
</svg>
