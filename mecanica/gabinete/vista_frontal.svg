<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <style>
    .label { font-size: 14px; fill: #222; }
    .dim { font-size: 12px; fill: #555; }
    .title { font-size: 20px; fill: #111; font-weight: bold; }
  </style>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" class="title">Vista frontal — Gabinete Consola 4 Jugadores (cotas en cm)</text>

  <!-- Cuerpo del gabinete -->
  <rect x="60" y="60" width="880" height="440" rx="18" ry="18"
        fill="#d9c7a3" stroke="#6b4f2a" stroke-width="4"/>

  <!-- 4 pantallas en fila -->
  <g>
    <rect x="90"  y="90" width="180" height="140" rx="6" fill="#111" stroke="#333" stroke-width="3"/>
    <rect x="300" y="90" width="180" height="140" rx="6" fill="#111" stroke="#333" stroke-width="3"/>
    <rect x="510" y="90" width="180" height="140" rx="6" fill="#111" stroke="#333" stroke-width="3"/>
    <rect x="720" y="90" width="180" height="140" rx="6" fill="#111" stroke="#333" stroke-width="3"/>
    <text x="180" y="165" text-anchor="middle" class="label" fill="#0f0">PONG</text>
    <text x="390" y="165" text-anchor="middle" class="label" fill="#0f0">SPACE INV.</text>
    <text x="600" y="165" text-anchor="middle" class="label" fill="#0f0">SNAKE</text>
    <text x="810" y="165" text-anchor="middle" class="label" fill="#0f0">CARRITO</text>
  </g>
  <text x="180" y="85" text-anchor="middle" class="dim">Pantalla 7" (15.5 x 9 cm visible)</text>

  <!-- 8 controles: 2 por pantalla, debajo de cada una -->
  <g>
    <!-- Pantalla 1 -->
    <circle cx="130" cy="280" r="26" fill="#c0392b" stroke="#000" stroke-width="2"/>
    <circle cx="230" cy="280" r="26" fill="#2980b9" stroke="#000" stroke-width="2"/>
    <!-- Pantalla 2 -->
    <circle cx="340" cy="280" r="26" fill="#c0392b" stroke="#000" stroke-width="2"/>
    <circle cx="440" cy="280" r="26" fill="#2980b9" stroke="#000" stroke-width="2"/>
    <!-- Pantalla 3 -->
    <circle cx="550" cy="280" r="26" fill="#c0392b" stroke="#000" stroke-width="2"/>
    <circle cx="650" cy="280" r="26" fill="#2980b9" stroke="#000" stroke-width="2"/>
    <!-- Pantalla 4 -->
    <circle cx="760" cy="280" r="26" fill="#c0392b" stroke="#000" stroke-width="2"/>
    <circle cx="860" cy="280" r="26" fill="#2980b9" stroke="#000" stroke-width="2"/>
  </g>
  <text x="500" y="330" text-anchor="middle" class="dim">8 estaciones de control (2 por pantalla) — 8 botones NES cada una: Arriba/Abajo/Izq/Der/Start/Select/A/B</text>

  <!-- Zona de ventilacion -->
  <rect x="90" y="440" width="820" height="40" fill="#bbb" stroke="#666" stroke-width="2"/>
  <text x="500" y="465" text-anchor="middle" class="dim">Rejilla de ventilación protegida (no accesible con los dedos)</text>

  <!-- Cotas generales -->
  <line x1="60" y1="520" x2="940" y2="520" stroke="#000" stroke-width="1"/>
  <line x1="60" y1="512" x2="60" y2="528" stroke="#000" stroke-width="1"/>
  <line x1="940" y1="512" x2="940" y2="528" stroke="#000" stroke-width="1"/>
  <text x="500" y="545" text-anchor="middle" class="label">Ancho total: 110 cm</text>

  <line x1="30" y1="60" x2="30" y2="500" stroke="#000" stroke-width="1"/>
  <line x1="22" y1="60" x2="38" y2="60" stroke="#000" stroke-width="1"/>
  <line x1="22" y1="500" x2="38" y2="500" stroke="#000" stroke-width="1"/>
  <text x="10" y="285" text-anchor="middle" class="label" transform="rotate(-90 10 285)">Alto: 55 cm</text>

  <text x="500" y="590" text-anchor="middle" class="dim">Bordes redondeados (radio 1.5 cm mínimo) — sin esquinas vivas, cableado interno, gabinete cerrado</text>
</svg>
