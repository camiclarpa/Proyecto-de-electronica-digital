<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6cd9c"/>
      <stop offset="100%" stop-color="#c9a86a"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1b1b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="btnRed" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff6b5c"/>
      <stop offset="100%" stop-color="#a4231a"/>
    </radialGradient>
    <radialGradient id="btnBlue" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5da8ff"/>
      <stop offset="100%" stop-color="#1a5aa4"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" font-size="34" font-weight="bold" fill="#111">
    Vista frontal — Gabinete Consola 4 Jugadores
  </text>
  <text x="800" y="86" text-anchor="middle" font-size="20" fill="#666">
    Cotas en centímetros · Concepto tipo mesa arcade (cocktail cabinet)
  </text>

  <!-- Cuerpo del gabinete -->
  <rect x="100" y="120" width="1400" height="700" rx="28" ry="28"
        fill="url(#wood)" stroke="#5c3f1f" stroke-width="6" filter="url(#softShadow)"/>

  <!-- 4 pantallas en fila -->
  <g>
    <rect x="150" y="160" width="280" height="220" rx="10" fill="url(#screenGlow)" stroke="#333" stroke-width="5" filter="url(#softShadow)"/>
    <rect x="470" y="160" width="280" height="220" rx="10" fill="url(#screenGlow)" stroke="#333" stroke-width="5" filter="url(#softShadow)"/>
    <rect x="790" y="160" width="280" height="220" rx="10" fill="url(#screenGlow)" stroke="#333" stroke-width="5" filter="url(#softShadow)"/>
    <rect x="1110" y="160" width="280" height="220" rx="10" fill="url(#screenGlow)" stroke="#333" stroke-width="5" filter="url(#softShadow)"/>

    <text x="290"  y="278" text-anchor="middle" font-size="26" font-weight="bold" fill="#39ff6a">PONG</text>
    <text x="610"  y="278" text-anchor="middle" font-size="22" font-weight="bold" fill="#39ff6a">SPACE INVADERS</text>
    <text x="930"  y="278" text-anchor="middle" font-size="26" font-weight="bold" fill="#39ff6a">SNAKE</text>
    <text x="1250" y="278" text-anchor="middle" font-size="24" font-weight="bold" fill="#39ff6a">CARRITO</text>

    <text x="290" y="145" text-anchor="middle" font-size="16" fill="#555">Pantalla 1 · 7"</text>
    <text x="610" y="145" text-anchor="middle" font-size="16" fill="#555">Pantalla 2 · 7"</text>
    <text x="930" y="145" text-anchor="middle" font-size="16" fill="#555">Pantalla 3 · 7"</text>
    <text x="1250" y="145" text-anchor="middle" font-size="16" fill="#555">Pantalla 4 · 7"</text>
  </g>

  <!-- 8 controles: 2 por pantalla, debajo de cada una -->
  <g>
    <!-- Pantalla 1 -->
    <circle cx="230" cy="470" r="42" fill="url(#btnRed)" stroke="#5c0e08" stroke-width="3" filter="url(#softShadow)"/>
    <circle cx="350" cy="470" r="42" fill="url(#btnBlue)" stroke="#0c2f5c" stroke-width="3" filter="url(#softShadow)"/>
    <!-- Pantalla 2 -->
    <circle cx="550" cy="470" r="42" fill="url(#btnRed)" stroke="#5c0e08" stroke-width="3" filter="url(#softShadow)"/>
    <circle cx="670" cy="470" r="42" fill="url(#btnBlue)" stroke="#0c2f5c" stroke-width="3" filter="url(#softShadow)"/>
    <!-- Pantalla 3 -->
    <circle cx="870" cy="470" r="42" fill="url(#btnRed)" stroke="#5c0e08" stroke-width="3" filter="url(#softShadow)"/>
    <circle cx="990" cy="470" r="42" fill="url(#btnBlue)" stroke="#0c2f5c" stroke-width="3" filter="url(#softShadow)"/>
    <!-- Pantalla 4 -->
    <circle cx="1190" cy="470" r="42" fill="url(#btnRed)" stroke="#5c0e08" stroke-width="3" filter="url(#softShadow)"/>
    <circle cx="1310" cy="470" r="42" fill="url(#btnBlue)" stroke="#0c2f5c" stroke-width="3" filter="url(#softShadow)"/>

    <text x="290"  y="545" text-anchor="middle" font-size="15" fill="#3a2c14">Jugador A / Jugador B</text>
    <text x="610"  y="545" text-anchor="middle" font-size="15" fill="#3a2c14">Jugador A / Jugador B</text>
    <text x="930"  y="545" text-anchor="middle" font-size="15" fill="#3a2c14">Jugador A / Jugador B</text>
    <text x="1250" y="545" text-anchor="middle" font-size="15" fill="#3a2c14">Jugador A / Jugador B</text>
  </g>

  <rect x="150" y="590" width="1240" height="3" fill="#8a6a3a"/>
  <text x="770" y="630" text-anchor="middle" font-size="19" fill="#333">
    8 estaciones de control (2 por pantalla) — cada una con 8 botones NES: Arriba / Abajo / Izq / Der / Start / Select / A / B
  </text>

  <!-- Zona de ventilacion -->
  <rect x="150" y="700" width="1240" height="55" rx="6" fill="#cfcfcf" stroke="#7a7a7a" stroke-width="3"/>
  <g stroke="#9a9a9a" stroke-width="3">
    <line x1="180" y1="710" x2="180" y2="745"/>
    <line x1="220" y1="710" x2="220" y2="745"/>
    <line x1="260" y1="710" x2="260" y2="745"/>
    <line x1="300" y1="710" x2="300" y2="745"/>
    <line x1="340" y1="710" x2="340" y2="745"/>
  </g>
  <text x="770" y="733" text-anchor="middle" font-size="16" fill="#444">
    Rejilla de ventilación protegida (paso &lt; 6mm, no accesible con los dedos)
  </text>

  <!-- Cotas generales -->
  <line x1="100" y1="850" x2="1500" y2="850" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="840" x2="100" y2="860" stroke="#000" stroke-width="2"/>
  <line x1="1500" y1="840" x2="1500" y2="860" stroke="#000" stroke-width="2"/>
  <text x="800" y="885" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Ancho total: 110 cm</text>

  <line x1="55" y1="120" x2="55" y2="820" stroke="#000" stroke-width="2"/>
  <line x1="45" y1="120" x2="65" y2="120" stroke="#000" stroke-width="2"/>
  <line x1="45" y1="820" x2="65" y2="820" stroke="#000" stroke-width="2"/>
  <text x="30" y="470" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" transform="rotate(-90 30 470)">Alto: 55 cm</text>

  <text x="800" y="940" text-anchor="middle" font-size="18" fill="#555">
    Bordes redondeados (radio ≥ 1.5 cm) · sin esquinas vivas · cableado interno protegido · gabinete completamente cerrado
  </text>
</svg>
