<svg viewBox="0 0 1600 1250" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="fpgaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ee08a"/>
      <stop offset="100%" stop-color="#1c8a4d"/>
    </linearGradient>
    <linearGradient id="psuGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc861"/>
      <stop offset="100%" stop-color="#c97e00"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1250" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" font-size="34" font-weight="bold" fill="#111">
    Vista interna (corte lateral) — Distribución de componentes
  </text>
  <text x="800" y="86" text-anchor="middle" font-size="20" fill="#666">
    Alto real: 75 cm (de pie) · Bajo voltaje (12V/5V) dentro; la conversión a 110V queda en el adaptador externo, sellado
  </text>

  <!-- Cuerpo del gabinete: 75cm de alto -->
  <rect x="100" y="120" width="1400" height="950" rx="28" ry="28"
        fill="none" stroke="#5c3f1f" stroke-width="6"/>

  <!-- Pantallas montadas en el frente -->
  <rect x="150" y="160" width="90" height="220" fill="#111" filter="url(#softShadow2)"/>
  <text x="195" y="400" text-anchor="middle" font-size="16" fill="#333">Pantallas</text>
  <text x="195" y="422" text-anchor="middle" font-size="16" fill="#333">(montadas al frente)</text>

  <!-- Placa FPGA -->
  <rect x="330" y="180" width="330" height="170" rx="12" fill="url(#fpgaGrad)" stroke="#145a32" stroke-width="4" filter="url(#softShadow2)"/>
  <text x="495" y="255" text-anchor="middle" font-size="24" font-weight="bold" fill="#08361b">Colorlight 5A-75E</text>
  <text x="495" y="285" text-anchor="middle" font-size="16" fill="#08361b">(sobre separadores, atornillada,</text>
  <text x="495" y="308" text-anchor="middle" font-size="16" fill="#08361b">nunca suelta dentro del gabinete)</text>

  <!-- Fuente de alimentacion -->
  <rect x="710" y="180" width="260" height="170" rx="12" fill="url(#psuGrad)" stroke="#8a5a00" stroke-width="4" filter="url(#softShadow2)"/>
  <text x="840" y="255" text-anchor="middle" font-size="24" font-weight="bold" fill="#4d2f00">Fuente 12V</text>
  <text x="840" y="285" text-anchor="middle" font-size="16" fill="#4d2f00">única para las</text>
  <text x="840" y="308" text-anchor="middle" font-size="16" fill="#4d2f00">4 pantallas + ventilador</text>

  <!-- Repisa interna (nueva, explicita) -->
  <rect x="310" y="365" width="680" height="20" fill="#bfa06a" stroke="#6b4f2a" stroke-width="2"/>
  <text x="650" y="400" text-anchor="middle" font-size="15" fill="#555">Repisa interna (soporta FPGA + fuente)</text>

  <!-- Canal de cableado -->
  <rect x="150" y="440" width="1150" height="60" fill="#eef2f3" stroke="#8fa0a6" stroke-width="4" stroke-dasharray="10,6"/>
  <text x="725" y="478" text-anchor="middle" font-size="18" fill="#3a4a4e">
    Canal / conducto de cableado interno (protege los cables de los 8 controles)
  </text>

  <!-- Conectores de control saliendo del canal hacia el frente -->
  <g stroke-width="6">
    <line x1="250" y1="500" x2="250" y2="600" stroke="#a4231a"/>
    <line x1="400" y1="500" x2="400" y2="600" stroke="#1a5aa4"/>
    <line x1="550" y1="500" x2="550" y2="600" stroke="#a4231a"/>
    <line x1="700" y1="500" x2="700" y2="600" stroke="#1a5aa4"/>
  </g>
  <circle cx="250" cy="610" r="14" fill="#ff6b5c" stroke="#5c0e08" stroke-width="3"/>
  <circle cx="400" cy="610" r="14" fill="#5da8ff" stroke="#0c2f5c" stroke-width="3"/>
  <circle cx="550" cy="610" r="14" fill="#ff6b5c" stroke="#5c0e08" stroke-width="3"/>
  <circle cx="700" cy="610" r="14" fill="#5da8ff" stroke="#0c2f5c" stroke-width="3"/>
  <text x="475" y="650" text-anchor="middle" font-size="17" fill="#333">
    Cable de uso rudo, con alivio de tensión, hacia cada control físico (ver seguridad)
  </text>

  <!-- Espacio libre inferior (aprovechado por la mayor altura) -->
  <rect x="150" y="700" width="1100" height="150" fill="none" stroke="#ddd" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="700" y="780" text-anchor="middle" font-size="16" fill="#999">
    Espacio libre adicional (ganado al subir de 55cm a 75cm) — reserva para cableado, refuerzos estructurales
  </text>

  <!-- Ventilador -->
  <circle cx="1310" cy="920" r="45" fill="#e8e8e8" stroke="#555" stroke-width="4" filter="url(#softShadow2)"/>
  <path d="M 1310 880 L 1320 920 L 1310 960 L 1300 920 Z" fill="#777"/>
  <path d="M 1270 920 L 1310 910 L 1350 920 L 1310 930 Z" fill="#777"/>
  <text x="1310" y="1015" text-anchor="middle" font-size="15" fill="#333">Ventilador 12V</text>
  <text x="1310" y="1033" text-anchor="middle" font-size="15" fill="#333">(extrae aire caliente,</text>
  <text x="1310" y="1051" text-anchor="middle" font-size="15" fill="#333">rejilla en ambos lados)</text>

  <!-- Conector de alimentacion trasero -->
  <rect x="1330" y="880" width="0" height="0"/> <!-- placeholder removido, movido junto al ventilador -->
  <rect x="1090" y="900" width="70" height="50" rx="6" fill="#7f8c8d" stroke="#000" stroke-width="3" filter="url(#softShadow2)"/>
  <text x="1125" y="975" text-anchor="middle" font-size="15" fill="#333">Entrada de</text>
  <text x="1125" y="995" text-anchor="middle" font-size="15" fill="#333">alimentación</text>
  <text x="1125" y="1015" text-anchor="middle" font-size="15" fill="#333">(parte trasera)</text>

  <!-- Ventilacion pasiva -->
  <rect x="150" y="900" width="880" height="35" fill="#cfcfcf" stroke="#8a8a8a" stroke-width="3"/>
  <text x="590" y="960" text-anchor="middle" font-size="17" fill="#333">
    Ventilación pasiva adicional — rejilla con paso menor a 6 mm
  </text>

  <text x="800" y="1150" text-anchor="middle" font-size="18" fill="#555">
    Ver requisitos completos en docs/manejo_errores_y_seguridad.md y mecanica/gabinete/disipacion_termica/
  </text>
</svg>
